name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run and compare benchmarks on push to main (compare with previous commit)
  benchmark-main:
    name: Benchmark (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2  # Need previous commit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install critcmp
        run: cargo install critcmp

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks on current commit
        run: cargo bench --bench benchmarks -- --noplot --save-baseline current

      - name: Checkout previous commit
        run: git checkout HEAD~1

      - name: Run benchmarks on previous commit
        run: cargo bench --bench benchmarks -- --noplot --save-baseline previous

      - name: Compare benchmarks
        run: |
          echo "## Benchmark Comparison (vs previous commit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comparing \`${GITHUB_SHA}\` against previous commit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          critcmp previous current >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion
          retention-days: 30

  # Run and compare benchmarks on PRs (compare with base branch)
  benchmark-pr:
    name: Benchmark (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install critcmp
        run: cargo install critcmp

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks on PR branch
        run: cargo bench --bench benchmarks -- --noplot --save-baseline pr

      - name: Checkout base branch
        run: git checkout "${GITHUB_BASE_REF}"

      - name: Run benchmarks on base branch
        run: cargo bench --bench benchmarks -- --noplot --save-baseline base

      - name: Compare benchmarks
        run: |
          echo "## Benchmark Comparison (PR vs ${GITHUB_BASE_REF})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          critcmp base pr >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Fork PRs get a read-only GITHUB_TOKEN, so commenting fails with 403 even
      # when pull-requests: write is requested. Benchmarks already ran and are
      # written to the job summary above — do not fail the check on comment.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');

            const output = execSync('critcmp base pr', { encoding: 'utf-8' });

            const body = `## 📊 Benchmark Comparison

            <details>
            <summary>Click to expand benchmark results</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            > Compared against \`${context.payload.pull_request.base.ref}\` branch
            `;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('Benchmark Comparison')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (error) {
              core.warning(
                `Unable to post benchmark comment (${error.message}). Results are in the job summary.`
              );
            }

      - name: Note fork PR benchmark results
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Fork PR: skipping PR comment (GITHUB_TOKEN cannot write). Benchmark comparison is in this job's summary."
